name: crispin-review-bot
description: crispin-lab PR 리뷰 · 답글 (Workload Identity Federation 으로 Claude 인증)

inputs:
  bot-token:
    description: 리뷰를 게시할 봇 계정의 PAT (crispin-bot)
    required: true
  federation-rule-id:
    description: Claude Console 의 federation rule id (fdrl_...)
    required: true
  organization-id:
    description: Anthropic organization id
    required: true
  service-account-id:
    description: 서비스 계정 id (svac_...)
    required: true
  workspace-id:
    description: rule 이 여러 워크스페이스를 가리킬 때만 (wrkspc_...)
    required: false
    default: ""
  model:
    description: 리뷰 · 답글 분류 모델
    required: false
    default: claude-opus-5-5
  critic-model:
    description: --with-critic 비평 모델
    required: false
    default: claude-sonnet-5-5
  default-args:
    description: pull_request 이벤트로 자동 리뷰할 때 붙일 플래그 (예 "--with-critic")
    required: false
    default: ""
  allowed-associations:
    description: "/pcr 명령을 허용할 author_association (쉼표 구분)"
    required: false
    default: OWNER,MEMBER
  legacy-bot-logins:
    description: 이전 봇 계정 (지문 · 스레드를 같은 봇으로 인정, 쉼표 구분)
    required: false
    default: ""
  max-budget-usd:
    description: 실행 한 번의 판단 단계 비용 상한
    required: false
    default: "5"
  claude-code-version:
    description: "@anthropic-ai/claude-code 버전"
    required: false
    default: 2.1.312

runs:
  using: composite
  steps:
    # setup-python 은 self-hosted macOS 에서 호스트 러너 경로(/Users/runner)에 설치하려다 실패한다.
    # 자체 러너는 이미 있는 python3(3.9+) · node(18+) 를 쓰고, 호스트 러너만 받아 쓴다.
    - if: runner.environment == 'github-hosted'
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - if: runner.environment == 'github-hosted'
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: 판단 단계 CLI 준비
      id: cli
      shell: bash
      env:
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
      run: |
        set -euo pipefail
        for tool in gh git curl python3 node npm; do
          command -v "${tool}" >/dev/null || { echo "::error::러너에 ${tool} 이 없습니다."; exit 1; }
        done
        python3 -c 'import sys; sys.exit(sys.version_info < (3, 9))' \
          || { echo "::error::python3 3.9 이상이 필요합니다 ($(python3 --version))."; exit 1; }
        node -e 'process.exit(Number(process.versions.node.split(".")[0]) < 18 ? 1 : 0)' \
          || { echo "::error::node 18 이상이 필요합니다 ($(node --version))."; exit 1; }
        # 러너에 이미 깔린 claude 를 쓰지 않는다 — 버전이 고정되지 않고, 전역 설치는 권한이 없을 수 있다.
        prefix="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP}}/pcr-claude-code/${CLAUDE_CODE_VERSION}"
        if [ ! -x "${prefix}/node_modules/.bin/claude" ]; then
          npm install --prefix "${prefix}" --no-fund --no-audit --loglevel=error \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
        fi
        "${prefix}/node_modules/.bin/claude" --version
        echo "bin=${prefix}/node_modules/.bin/claude" >> "${GITHUB_OUTPUT}"

    - name: 리뷰 실행
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.bot-token }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation-rule-id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization-id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service-account-id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace-id }}
        PCR_CLAUDE_BIN: ${{ steps.cli.outputs.bin }}
        PCR_MODEL: ${{ inputs.model }}
        PCR_MODEL_CRITIC: ${{ inputs.critic-model }}
        PCR_DEFAULT_ARGS: ${{ inputs.default-args }}
        PCR_ALLOWED_ASSOCIATIONS: ${{ inputs.allowed-associations }}
        PCR_LEGACY_BOT_LOGINS: ${{ inputs.legacy-bot-logins }}
        PCR_MAX_BUDGET_USD: ${{ inputs.max-budget-usd }}
      run: |
        set -euo pipefail

        if [ -z "${GH_TOKEN}" ]; then
          echo "봇 토큰이 없습니다 (fork PR 에는 secret 이 전달되지 않습니다). 건너뜁니다."
          exit 0
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::job 에 'id-token: write' 권한이 필요합니다."
          exit 1
        fi
        missing=""
        [ -n "${ANTHROPIC_FEDERATION_RULE_ID}" ] || missing="${missing} federation-rule-id"
        [ -n "${ANTHROPIC_ORGANIZATION_ID}" ] || missing="${missing} organization-id"
        [ -n "${ANTHROPIC_SERVICE_ACCOUNT_ID}" ] || missing="${missing} service-account-id"
        if [ -n "${missing}" ]; then
          echo "::error::Workload Identity Federation 값이 비어 있습니다:${missing}. 호출 워크플로가 넘기는 repository variable(vars.*) 이 등록돼 있는지 확인해 주세요 (secret 으로 등록하면 vars 로 읽히지 않습니다)."
          exit 1
        fi
        [ -n "${ANTHROPIC_WORKSPACE_ID}" ] || unset ANTHROPIC_WORKSPACE_ID
        # 정적 자격증명이 있으면 federation 보다 우선하므로 확실히 비운다.
        unset ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_AUTH_TOKEN
        # 자체 러너 사용자의 ~/.claude (hooks · 플러그인 · 로그인) 가 섞이지 않게 빈 설정 디렉토리를 쓴다.
        export CLAUDE_CONFIG_DIR="${RUNNER_TEMP}/pcr-claude-config"
        rm -rf "${CLAUDE_CONFIG_DIR}" && mkdir -p "${CLAUDE_CONFIG_DIR}"

        export ANTHROPIC_IDENTITY_TOKEN_FILE="${RUNNER_TEMP}/pcr-oidc.jwt"
        fetch_identity_token() {
          curl -sSf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])' \
            > "${ANTHROPIC_IDENTITY_TOKEN_FILE}.tmp"
          mv "${ANTHROPIC_IDENTITY_TOKEN_FILE}.tmp" "${ANTHROPIC_IDENTITY_TOKEN_FILE}"
        }
        fetch_identity_token
        # GitHub OIDC 토큰은 약 5분 뒤 만료된다. 긴 리뷰 중에도 파일이 유효하게 갱신한다.
        ( while sleep 240; do fetch_identity_token || true; done ) &
        refresher=$!
        trap 'kill "${refresher}" 2>/dev/null || true; rm -rf "${CLAUDE_CONFIG_DIR}" "${ANTHROPIC_IDENTITY_TOKEN_FILE}" "${RUNNER_TEMP}/pcr"' EXIT

        export PCR_WORK_DIR="${RUNNER_TEMP}/pcr"
        "${GITHUB_ACTION_PATH}/bin/pcr" ci
